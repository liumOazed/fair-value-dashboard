name: Monthly run
# Buttons on the dashboard open this page. Pick a step and press "Run workflow".
# Each step runs once per month; a second run that month does nothing (tick "force" only to redo a corrected CSV).
# On the 1st (and on a manual run) it first makes this month's screener CSV itself if none was uploaded:
# scripts/growth_screener.py runs here on GitHub (~20 min) and saves data/screens/growth_screen_results_YYYY-MM.csv.
# Uploading your own CSV for the month still works and is never overwritten.
on:
  schedule:
    - cron: "0 3 1 * *"        # 03:00 UTC on the 1st of every month
  push:
    paths:
      - "data/screens/*.csv"   # uploading the new month's CSV runs both steps
  workflow_dispatch:
    inputs:
      step:
        description: "What to run"
        type: choice
        options: [growth, fair_value, both]
        default: both
      force:
        description: "Force re-run even if this month is already done"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: { group: monthly, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy
      - name: Make this month's screener CSV if none was uploaded
        if: github.event_name != 'push'
        run: |
          M=$(date -u +%Y-%m)
          OUT="data/screens/growth_screen_results_${M}.csv"
          if [ -f "$OUT" ]; then echo "$OUT already exists (uploaded or made earlier): using it"; exit 0; fi
          pip install yfinance lxml
          python scripts/growth_screener.py --out /tmp/screen.csv > /tmp/screener.log 2>&1 || true
          grep -E "S&P 500|Nasdaq 100|::warning::" /tmp/screener.log || true   # universe lines (were hidden by tail before)
          tail -40 /tmp/screener.log
          python - "$OUT" <<'PY'
          import sys, shutil, pandas as pd
          out = sys.argv[1]
          d = pd.read_csv("/tmp/screen.csv")
          ok = len(d) >= 450 and d["rev_growth_pct"].notna().sum() >= 400
          print(f"screener rows: {len(d)}, with revenue growth: {d['rev_growth_pct'].notna().sum()}")
          if not ok:
              shutil.copy("/tmp/screen.csv", out.replace("data/screens/", "data/screens/extra/").replace(".csv", "_incomplete.csv"))
              print("::warning::Screener run looks incomplete (Yahoo limits?). Saved to data/screens/extra/ for inspection; upload a CSV or re-run.")
          else:
              shutil.copy("/tmp/screen.csv", out); print("saved", out)
          PY
      - name: Fetch Fair Value stocks that are not in the screened universe
        # Stocks with a fair value model but outside the S&P 500 + Nasdaq 100 (e.g. SHOP, ADYEY, FISV, CRCL) are fetched
        # on their own into data/screens/extra/fv_extra_YYYY-MM.csv; build_screen.py adds them to the Growth Screen.
        if: github.event_name != 'push'
        run: |
          M=$(date -u +%Y-%m)
          OUT="data/screens/extra/fv_extra_${M}.csv"; CSV="data/screens/growth_screen_results_${M}.csv"
          if [ -f "$OUT" ] || [ ! -f "$CSV" ]; then echo "nothing to fetch"; exit 0; fi
          T=$(python - "$CSV" <<'PY'
          import json, sys, pandas as pd
          have = set(pd.read_csv(sys.argv[1]).ticker)
          print(",".join(a["ticker"] for a in json.load(open("data/assets.json"))["assets"] if a.get("type") == "stock" and a["ticker"] not in have))
          PY
          )
          if [ -z "$T" ]; then echo "every Fair Value stock is in the universe"; exit 0; fi
          echo "fetching $T"; pip install yfinance lxml
          mkdir -p data/screens/extra
          python scripts/growth_screener.py --tickers "$T" --out "$OUT" 2>&1 | tail -15 || true
      - run: python scripts/monthly.py --step "${{ inputs.step || 'both' }}" ${{ inputs.force && '--force' || '' }}
      - run: python scripts/update_prices.py || true
      - run: python scripts/track.py --snapshot || true     # record this month's signals for the forward test
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Monthly run: $(date -u +%Y-%m)"
          git pull --rebase && git push
