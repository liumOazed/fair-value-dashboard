name: Backtest data
# NOTE: the SEC blocks GitHub's servers (HTTP 403), so the data fetch must run on a home computer:
#   python scripts/bt_fetch.py   then push data/backtest/. This workflow is kept for re-running the backtest only.
on:
  workflow_dispatch: {}
  push:
    paths: [".github/backtest-request.json"]
permissions:
  contents: write
concurrency: { group: backtest, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: .bt_cache
          key: bt-cache-v1-${{ github.run_id }}
          restore-keys: bt-cache-v1-
      - run: pip install pandas numpy lxml
      - name: Fetch
        run: |
          LIMIT=$(python -c "import json; print(json.load(open('.github/backtest-request.json')).get('limit', 0))" || echo 0)
          python scripts/bt_fetch.py --limit "$LIMIT" 2>&1 | tee bt_fetch.log
      - run: cp bt_fetch.log data/backtest/fetch.log
      - name: Run backtest
        run: |
          pip install scipy
          python scripts/bt_run.py 2>&1 | tail -60 > data/backtest/run.log || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/
          git diff --staged --quiet || git commit -m "Backtest data $(date -u +%Y-%m-%d)"
          git pull --rebase && git push
