name: Fetch model inputs
# Fetches raw inputs (price, shares, TTM revenue / FCF / stock pay, cash, debt, analyst estimates) for new stocks.
# Trigger: commit .github/inputs-request.json ({"tickers": "V,MA", "out": "data/inputs/x.json"}) or run manually.
on:
  workflow_dispatch:
    inputs:
      tickers: { description: "Comma-separated tickers", required: true }
  push:
    paths: [".github/inputs-request.json"]
permissions:
  contents: write
concurrency: { group: inputs, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas
      - name: Work out request
        id: req
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, datetime
          t = os.environ.get("IN_TICKERS", ""); out = f"data/inputs/inputs_{datetime.date.today():%Y-%m-%d}.json"
          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              r = json.load(open(".github/inputs-request.json")); t = r.get("tickers", ""); out = r.get("out", out)
          print(f"tickers={t}"); print(f"out={out}")
          PY
        env: { IN_TICKERS: "${{ inputs.tickers }}" }
      - run: python scripts/fetch_inputs.py --tickers "${{ steps.req.outputs.tickers }}" --out "${{ steps.req.outputs.out }}" 2>&1 | tee fetch.log
      - name: Commit result
        run: |
          git config user.name "inputs-bot"
          git config user.email "inputs-bot@users.noreply.github.com"
          git add data/inputs/
          git diff --staged --quiet || git commit -m "Model inputs: ${{ steps.req.outputs.out }}"
          git pull --rebase && git push
