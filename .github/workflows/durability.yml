name: Bonds and durability
# Fetches the 10-year Treasury and Moody's Aaa yields from FRED (scripts/bond_yields.py), then rebuilds
# data/durability.json (advantage over bonds and the two profit stress tests in each stock's drawer).
# Runs on the 3rd of each month (after the snapshot refresh), when .github/durability-request.json is committed, or manually.
on:
  schedule: [{ cron: "37 4 3 * *" }]
  workflow_dispatch:
  push:
    paths: [".github/durability-request.json"]
permissions:
  contents: write
concurrency: { group: durability, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/bond_yields.py
      - run: python scripts/durability.py | tail -20
      - run: python scripts/debt_stress.py
      - run: python scripts/duration.py
      - run: pip install -q yfinance pandas && python scripts/framework.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bond_yields.json data/durability.json data/framework.json data/debt_stress.json data/duration.json
          git diff --staged --quiet || git commit -m "Bonds and durability $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
