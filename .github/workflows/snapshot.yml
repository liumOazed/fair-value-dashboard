name: Refresh stock snapshot
# Fetches dividends, annual history, liquidity and 6 years of prices for every stock on the Fair Value tab,
# then rebuilds data/snapshot.json (the six-card snapshot in each stock's drawer).
# Runs on the 2nd of each month, when .github/snapshot-request.json is committed, or manually.
on:
  schedule: [{ cron: "17 3 2 * *" }]
  workflow_dispatch:
  push:
    paths: [".github/snapshot-request.json"]
permissions:
  contents: write
concurrency: { group: snapshot, cancel-in-progress: false }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy
      - run: python scripts/fetch_snapshot.py 2>&1 | tee fetch.log
      - run: if [ -f scripts/build_snapshot.py ]; then python scripts/build_snapshot.py; fi
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot_raw.json; if [ -f data/snapshot.json ]; then git add data/snapshot.json; fi
          git diff --staged --quiet || git commit -m "Snapshot refresh $(date -u +%Y-%m-%d)"
          git pull --rebase && git push
