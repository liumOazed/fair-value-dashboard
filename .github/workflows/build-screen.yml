name: Build growth screen
# Rebuilds the screen when themes change. New monthly CSVs are handled by monthly.yml (with the once-a-month lock).
on:
  push:
    paths:
      - "data/themes.json"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy
      - run: python scripts/build_screen.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/screen.json data/cache
          git diff --staged --quiet || git commit -m "Rebuild growth screen"
          git push
