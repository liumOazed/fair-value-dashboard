name: Build growth screen
on:
  push:
    paths:
      - "data/screens/*.csv"
      - "data/themes.json"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy
      - run: python scripts/build_screen.py
      - name: Commit changes
        run: |
          git config user.name "screen-bot"
          git config user.email "screen-bot@users.noreply.github.com"
          git add data/screen.json
          git diff --staged --quiet || git commit -m "Rebuild growth screen"
          git push
